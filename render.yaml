services:
  - type: web
    name: vanoria
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: VANORIA_STORE_MODE
        value: preview
